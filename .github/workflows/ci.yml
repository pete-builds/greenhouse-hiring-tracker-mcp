name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lockfile-drift:
    name: Lockfile drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify every pinned dep in source matches the lockfile
        run: |
          python3 <<'PYEOF'
          import re, sys, pathlib
          PAIRS = [("requirements.txt", "requirements.lock")]
          def norm(name):
              return re.sub(r"[._-]+", "-", name.lower())
          fail = False
          for src, lock in PAIRS:
              if not pathlib.Path(src).exists() or not pathlib.Path(lock).exists():
                  continue
              lock_text = pathlib.Path(lock).read_text()
              for raw in pathlib.Path(src).read_text().splitlines():
                  line = raw.split("#", 1)[0].strip()
                  if not line or line.startswith(("-r", "-c", "--")):
                      continue
                  m = re.match(r"^([A-Za-z0-9._-]+)(?:\[[^\]]+\])?==(\S+)\s*$", line)
                  if not m:
                      continue
                  pkg, ver = norm(m.group(1)), m.group(2)
                  hit = re.search(rf"(?im)^{re.escape(pkg)}==(\S+?)(?:\s|\\|$)", lock_text)
                  if not hit:
                      print(f"::error file={src}::{m.group(1)}=={ver} pinned in {src} but missing from {lock}")
                      fail = True
                  elif hit.group(1) != ver:
                      print(f"::error file={src}::{m.group(1)}: {src} pins =={ver} but {lock} has =={hit.group(1)}. Regenerate with: uv pip compile {src} -o {lock} --generate-hashes --python-version 3.13 --python-platform linux")
                      fail = True
          sys.exit(1 if fail else 0)
          PYEOF

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          pip install --require-hashes -r requirements.lock
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Import smoke test
        env:
          TRACKER_DB_PATH: /tmp/tracker.db
        run: |
          touch /tmp/tracker.db
          python -c "import server; import clients.tracker; import clients.greenhouse; import clients.parser"

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime deps (hash-pinned) + test toolchain
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          tags: anthropic-tracker-mcp:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: anthropic-tracker-mcp:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
