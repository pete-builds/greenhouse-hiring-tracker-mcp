x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  hiring-hub-mcp:
    # Pull the published image by default. To build locally instead, comment
    # out the image line and uncomment `build: .`.
    image: ghcr.io/pete-builds/greenhouse-hiring-tracker-mcp:1.0.0
    # build: .
    container_name: hiring-hub-mcp
    restart: unless-stopped
    ports:
      - "3713:3713"
    environment:
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=3713
      - HUB_DB_PATH=/hub/hub.db
      - HUB_SYNC_INTERVAL_HOURS=${HUB_SYNC_INTERVAL_HOURS:-12}
      - HUB_CONTACT=${HUB_CONTACT:-}
      - TZ=${TZ:-America/New_York}
    volumes:
      # The hub's own store: companies, jobs, applications, profile. Writable.
      - hiring-hub-data:/hub
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Upgrading from the Anthropic-only tracker and want its history (department
    # trends and alerts since it started)? Mount its volume read-only in a
    # docker-compose.override.yml; the anthropic_* tools appear when it exists:
    #
    #   services:
    #     hiring-hub-mcp:
    #       environment:
    #         - TRACKER_DB_PATH=/data/tracker.db
    #       volumes:
    #         - anthropic-tracker-data:/data:ro
    #   volumes:
    #     anthropic-tracker-data:
    #       external: true

volumes:
  hiring-hub-data:
