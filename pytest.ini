[pytest]
asyncio_mode = auto
testpaths = tests
# MCP SDK v2 renamed protocol fields to snake_case and FastMCP 4 keeps the old
# camelCase reads alive through a deprecation bridge slated for removal. Fail
# on any use of it now, while the fix is a rename, not after it disappears.
filterwarnings =
    error::fastmcp.FastMCPDeprecationWarning
